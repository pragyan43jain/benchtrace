services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: benchtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: benchtrace
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U benchtrace]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    image: redis:7.4.3-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
  engine:
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    build: ./ai-engine
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:?Set ENGINE_TOKEN in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - uploads:/uploads:ro
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
  api:
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 10
    build: ./backend
    environment:
      DATABASE_URL: postgres://benchtrace:${POSTGRES_PASSWORD}@db:5432/benchtrace
      REDIS_URL: redis:6379
      ENGINE_URL: http://engine:8000
      ENGINE_TOKEN: ${ENGINE_TOKEN}
      UPLOAD_DIR: /uploads
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
  web:
    restart: unless-stopped
    build: ./frontend
    ports: ['127.0.0.1:${BENCHTRACE_PORT:-8080}:80']
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  redis:
  uploads:
