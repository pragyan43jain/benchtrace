name: Verified engineering workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache-dependency-path: backend/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 scripts/setup-env.py && docker compose build && docker compose up -d
      - name: Validate published-image Compose overlay
        run: |
          BENCHTRACE_VERSION=v0.1.6-rc.1 docker compose -f compose.yaml -f compose.published.yaml config --format json | python3 -c 'import json,sys; services=json.load(sys.stdin)["services"]; expected={"api":"ghcr.io/pragyan43jain/benchtrace-backend:v0.1.6-rc.1","engine":"ghcr.io/pragyan43jain/benchtrace-ai-engine:v0.1.6-rc.1","web":"ghcr.io/pragyan43jain/benchtrace-frontend:v0.1.6-rc.1"}; assert all(services[name].get("image")==image and "build" not in services[name] for name,image in expected.items())'
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose run --rm --no-deps engine sh -c 'python -m pytest -q -p no:cacheprovider && python evaluation/run.py'
      - run: python3 scripts/integration.py && python3 scripts/security-check.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence
          path: |
            compose.log
            docs/*.png
            frontend/test-results
      - if: always()
        run: docker compose down
