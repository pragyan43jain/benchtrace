name: Verified engineering workflow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: backend/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/setup-env.py && docker compose build && docker compose up -d
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose run --rm --no-deps engine python -m pytest -q -p no:cacheprovider
      - run: python3 scripts/integration.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            compose.log
            docs/*.png
            frontend/test-results
      - if: always()
        run: docker compose down
